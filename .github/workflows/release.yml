# Release workflow: builds sdist + wheel and attaches them to a GitHub
# Release for every pushed `v*` tag.
#
# NOTE: this workflow intentionally does NOT publish to PyPI. The
# distribution name "llmpeg" is already registered on PyPI by an unrelated
# project, so `uv publish` / `twine upload` would fail (or worse, target the
# wrong project). Publishing this project to PyPI would require choosing and
# registering a different distribution name first. Until then, release
# artifacts are only attached to GitHub Releases.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Build sdist and wheel
        run: uv build --python 3.14

      - name: Verify distributions
        run: uv run --with twine twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
