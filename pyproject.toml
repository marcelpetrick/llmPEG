[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "promptpress"
version = "0.1.0"
description = "An honest experimental semantic image codec"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PromptPress contributors" }]
dependencies = ["Pillow==11.3.0"]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.12",
  "types-Pillow==10.2.0.20240822",
]

[project.scripts]
promptpress = "promptpress.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptpress"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/promptpress/survey.py" = ["E501"] # Embedded HTML/CSS/JS is intentionally compact.

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["promptpress"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["promptpress"]

[tool.coverage.report]
show_missing = true
skip_covered = true
