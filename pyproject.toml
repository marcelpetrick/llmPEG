[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "llmpeg"
version = "0.2.0"
description = "An honest experimental semantic image codec"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Marcel Petrick", email = "mail@marcelpetrick.it" }]
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
dev = [
  "build==1.6.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
]

[project.scripts]
llmpeg = "llmpeg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmpeg"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/llmpeg/survey.py" = ["E501"] # Embedded HTML/CSS/JS is intentionally compact.

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["llmpeg"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llmpeg"]

[tool.coverage.report]
show_missing = true
skip_covered = true
